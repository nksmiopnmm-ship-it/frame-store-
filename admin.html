<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FRAME — لوحة الإدارة</title><style>
:root{--bg:#f8f7f4;--ink:#20211f;--muted:#777873;--line:#e9e7e1;--beige:#e9dfcf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.65}.wrap{width:min(1100px,calc(100% - 28px));margin:30px auto}.brand{font-size:26px;letter-spacing:3px;font-weight:700}.sub{color:var(--muted);font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}input{min-width:220px;flex:1}button{background:var(--ink);color:white;cursor:pointer}button.secondary{background:white;color:var(--ink)}.hidden{display:none!important}.message{padding:12px;border-radius:10px;background:#f3ede3;margin-top:12px}.error{background:#f8e8e5;color:#843a30}.order{border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.orderHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.id{font:12px monospace;color:var(--muted)}.badge{background:#f3ede3;border-radius:20px;padding:4px 10px;font-size:12px}.meta{color:var(--muted);font-size:13px}.details{white-space:pre-wrap;background:#faf9f6;padding:12px;border-radius:10px;margin-top:10px}.orderItems{font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls select{min-width:180px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">FRAME</div><div class="sub">لوحة إدارة الطلبات — لا تشارك رمز الإدارة مع أي شخص.</div></div><a href="/" style="text-decoration:none">← العودة إلى المتجر</a></div><section class="panel"><h2 style="margin-top:0">دخول الإدارة</h2><form id="login" class="row"><input id="token" type="password" autocomplete="current-password" placeholder="رمز الإدارة (ADMIN_TOKEN)" required><button>عرض الطلبات</button></form><div id="message" aria-live="polite"></div></section><section id="dashboard" class="hidden"><div class="top"><h2>الطلبات الواردة</h2><button id="refresh" class="secondary">تحديث</button></div><div id="stats" class="sub"></div><div id="orders"></div></section></main><script>
let token='';const $=id=>document.getElementById(id);const labels={new:'جديد',in_progress:'قيد التنفيذ',awaiting_customer:'بانتظار العميل',completed:'مكتمل',cancelled:'ملغي'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function money(n){return n==null?'يحدد لاحقًا':Number(n).toLocaleString('en-US')+' د.ع'}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','x-admin-token':token,...options.headers}});const d=await r.json();if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
$('login').addEventListener('submit',async e=>{e.preventDefault();token=$('token').value;await load()});$('refresh').addEventListener('click',load);
async function load(){try{const d=await api('/api/admin/orders');$('dashboard').classList.remove('hidden');$('message').className='message';$('message').textContent='تم الاتصال بلوحة الإدارة.';$('stats').textContent=`إجمالي الطلبات: ${d.orders.length} · الجديدة: ${d.orders.filter(o=>o.status==='new').length}`;$('orders').innerHTML=d.orders.length?d.orders.map(o=>`<article class="order"><div class="orderHead"><div><strong>${esc(o.customerName)}</strong> <span class="id">#${esc(o.id.slice(0,8).toUpperCase())}</span><div class="meta">${new Date(o.createdAt).toLocaleString('ar-IQ')} · ${o.kind==='custom'?'تصميم مخصص':'طلب متجر'}</div></div><span class="badge">${labels[o.status]||esc(o.status)}</span></div><p>التواصل: <b>${esc(o.contact)}</b></p>${o.kind==='cart'?`<div class="orderItems">${o.items.map(i=>`${esc(i.name)} × ${i.quantity} — ${money(i.lineTotalIQD)}`).join('<br>')}</div><p><b>المجموع: ${money(o.totalIQD)}</b></p><p>طريقة الدفع: ${({'cod':'الدفع عند الاستلام بالاتفاق','fastpay':'FastPay — تعليمات الدفع يدويًا','zaincash':'زين كاش — تعليمات الدفع يدويًا','direct':'اتفاق مباشر'})[o.paymentMethod]||'اتفاق مباشر'}</p>${o.promotionApplied?'<div class="message">ينطبق عرض الافتتاح: تصميم مخصص واحد مجانًا.</div>':''}`:`<p>النوع: ${esc(o.designType)} · الميزانية: ${esc(o.budget)}</p><div class="details">${esc(o.details)}</div>`}<div class="controls"><select id="s-${esc(o.id)}">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select><button onclick="updateStatus('${esc(o.id)}')">حفظ الحالة</button></div></article>`).join(''):'<div class="panel">لا توجد طلبات بعد.</div>'}catch(err){$('dashboard').classList.add('hidden');$('message').className='message error';$('message').textContent=err.message}}
async function updateStatus(id){try{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:$('s-'+id).value})});await load()}catch(e){$('message').className='message error';$('message').textContent=e.message}}
</script></body></html>
